<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Department Detail | ROBU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="p-8 md:p-24">
    <div class="max-w-5xl mx-auto">
        <a href="departments.html" class="text-blue-400 hover:text-blue-300 mb-8 inline-block">&larr; Back to Departments</a>
        
        <h1 class="text-4xl font-bold mb-4" id="dept-title">Strategic Planning (SP)</h1>
        <p class="text-xl text-slate-400 mb-12 max-w-3xl" id="dept-desc">
            Shaping the long-term vision of the club, planning flagship national competitions (like TRACTION), and coordinating major robotics projects.
        </p>

        <h2 class="text-2xl font-semibold mb-6 border-b border-slate-700 pb-2">Current Panel</h2>
        
        <!-- Scrolling Fashion Panel -->
        <div class="scrolling-wrapper">
            <!-- Example Card 1 -->
            <div class="scrolling-card bg-slate-800 rounded-lg p-4 text-center border border-slate-700">
                <img src="ROBU_Photos/DADS panel/SP/director.jpg" alt="Director" class="w-32 h-32 mx-auto rounded-full object-cover mb-4">
                <h3 class="font-bold text-lg">Jane Doe</h3>
                <p class="text-blue-400 text-sm">Director</p>
            </div>
            <!-- Example Card 2 -->
            <div class="scrolling-card bg-slate-800 rounded-lg p-4 text-center border border-slate-700">
                <img src="ROBU_Photos/DADS panel/SP/ad.jpg" alt="Assistant Director" class="w-32 h-32 mx-auto rounded-full object-cover mb-4">
                <h3 class="font-bold text-lg">John Smith</h3>
                <p class="text-blue-400 text-sm">Assistant Director</p>
            </div>
             <!-- Add more cards as needed -->
        </div>
    </div>
</body>
</html>
