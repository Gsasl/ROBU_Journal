<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBU | Robotics Club of BRAC University</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="font-sans antialiased">
    
    <!-- Hero Section with Fading Background -->
    <header class="hero-bg min-h-screen flex flex-col items-center justify-center text-center px-4">
        <div class="hero-content max-w-4xl mx-auto flex flex-col items-center">
            
            <!-- Club Logo -->
            <img src="ROBU_Photos/logo.png" alt="ROBU Logo" class="w-32 h-32 mb-8 rounded-full shadow-lg border-2 border-slate-700">
            
            <!-- Clear Striking Intro -->
            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-4 text-white drop-shadow-md">
                Robotics Club of BRAC University
            </h1>
            <p class="text-xl md:text-2xl font-light italic mb-8 text-slate-300">
                "Small is beautiful, but big is necessary"
            </p>
            <p class="text-lg text-slate-400 mb-10 max-w-2xl leading-relaxed">
                Evolved from a small laboratory into a national launchpad for deep-tech innovation and global engineering competitiveness.
            </p>

            <!-- Navigation / Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
                <a href="departments.html" class="px-8 py-3 rounded-lg border border-slate-600 hover:bg-slate-800 transition">Our Departments</a>
                <a href="about.html" class="px-8 py-3 rounded-lg border border-slate-600 hover:bg-slate-800 transition">About Us</a>
                <!-- Join Us opens in a new tab -->
                <a href="https://docs.google.com/forms/your-form-link" target="_blank" rel="noopener noreferrer" class="px-8 py-3 rounded-lg bg-blue-600 hover:bg-blue-700 font-bold shadow-lg transition">Join Us</a>
            </div>
        </div>
    </header>

</body>
</html>
